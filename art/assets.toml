# ──────────────────────────── лобби: усадьба ────────────────────────────────
#
# Лобби устроено как городской экран в третьих «Героях»: нарисованный двор,
# а на нём отдельными постройками стоят места, куда можно пойти. Постройка —
# вырезанный спрайт, а не часть фона, ровно поэтому: её надо подсвечивать
# при наведении, показывать поверх неё значки и заменять по мере развития,
# а вплавленную в фон постройку не тронешь.
#
# Каждая постройка ведёт в существующий экран игры:
#   грядки    -> scenes/farm/Farm.tscn
#   дом       -> scenes/collection/Collection.tscn
#   амбар     -> scenes/inventory/Inventory.tscn
#   лес       -> scenes/run/RunFeed.tscn
#
# Лавка (scenes/shop) в списке не значится намеренно: её не просили. Когда
# понадобится — это ещё одна постройка и один промпт.

[kind.building]
size = 128
variants = 4
gen_width = 1024
gen_height = 1024
cutout = true
# «no ground» намеренно: постройка встаёт на нарисованную землю двора, и её
# собственное светлое пятно земли ложится поверх чужой почвы заметной заплатой.
# Проверено на первой сборке двора.
style = "single small structure seen straight from the front, cut off cleanly at its base with no ground patch and no shadow beneath it, no people, no surrounding scenery, thick readable silhouette"

