# ─────────────────────── разнообразие фонов леса ────────────────────────────
#
# Двадцать фонов под ленту забега. Бой — 65% полян (GDD §8.2), и с одним фоном
# лес читается как один и тот же коридор. Поэтому это двадцать РАЗНЫХ сцен,
# а не двадцать бросков одного промпта: разнообразие несёт содержание кадра,
# а не случайность сида.
#
# Различаются по трём осям сразу: порода леса, рельеф и подлесок, свет.
# Общее для всех — крона смыкается над кадром (в палитре нет неба, решение
# по нему принято для полян), нижняя треть свободна под геймплей.

[kind.forest]
size = 480
variants = 3
gen_width = 832
gen_height = 1216
cutout = false
style = "dense leaf canopy overhead closing off the sky, no open sky visible, open uncluttered ground across the lower third, forest depth fading into haze"

