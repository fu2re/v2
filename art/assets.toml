# Манифест графики BEATROOT.
#
# Здесь перечислено ВСЁ, что игра показывает на экране. Это источник правды
# для пайплайна: `artgen batch` генерирует по этому файлу, `artgen gallery`
# по нему же строит страницу ревью, а `artgen manifest --check` сверяет его
# с `data/*.tres` — новый монстр без записи об арте виден сразу, а не через
# месяц по розовому квадрату в бою.
#
# Правила промптов. Выведены из разбора первых 36 ассетов: 25 сработали
# с первого раза, 11 потребовали от 2 до 7 попыток, и провалы кучкуются.
#
#   1. НАЗЫВАЙ ВЕЩЬ, А НЕ МАТЕРИАЛ. Начинай с существительного, которое модель
#      знает, и только потом навешивай признаки. Все семь провальных попыток
#      Топотуна — это «creature built of mossy river stones»: сущность не
#      названа, и модель подставляет ближайшее знакомое. Заработало с первого
#      раза, как только появилось «half bear and half fox».
#      Так же слегли «circlet» (вышел бублик) и «jelly blob» (вышел колобок).
#      Груша, инжир, сундук, мешочек — все названы прямо и взяты с первой попытки.
#   2. ЗАДАВАЙ РАКУРС. Без него модель снимает предмет в перспективе, и на 64px
#      пояс превращается в бурый овал. Ракурс задан в `style` вида — не дублируй.
#   3. Цвета описываются словарём палитры проекта: охра, олива, терракота,
#      тёплое золото. Просить «indigo» или «neon» бессмысленно — квантование
#      всё равно уведёт цвет в землю, но по дороге испортит форму.
#   4. Никакого насилия и угрозы (CLAUDE.md §4). Монстры дружелюбны даже когда
#      мешают: аудитория 7+.
#   5. Промпт описывает ЧТО нарисовать. КАК — задаётся шаблоном стиля в
#      comfy.py и полем `style` вида ассета, а не переписывается в каждой строке.
#   6. Милота не отменяет анатомию. «Максимально милый» без названных ушей,
#      морды и хвоста растворяет их в шарике — проверено на пятой попытке
#      Топотуна. Признаки зверя перечисляй поимённо.
#
# `generated = false` значит «генерации не отдаётся никогда» (GDD §11.3):
# UI, ноты и индикаторы рисуются вручную, потому что от их читаемости зависит
# честность боя. Они остаются в манифесте, чтобы галерея показывала полный
# список графики игры, включая ещё не сделанное.


# ──────────────────────────────── грейды ────────────────────────────────────
#
# Шесть грейдов из MonsterData.Rarity. Вид с грейдом раскрывается манифестом
# в шесть ассетов: `bass_bear_common`, `bass_bear_uncommon` и так далее —
# писать тридцать записей руками значит гарантированно их рассинхронить.
#
# **Это не эволюция.** Зверь остаётся тем же самым: та же морда, тот же силуэт,
# та же библиотека танцев.
#
# Способ — перебор. Старший грейд рисуется тем же промптом, что и базовый,
# многими сидами; годится тот кандидат, который вышел похожим на принятую
# основу. Похожесть меряется автоматически (метрика `similarity`: совпадение
# силуэта плюс совпадение раскладки по палитре), и кандидаты в контакт-листе
# идут по ней сверху вниз — иначе перебирать восемь картинок на грейд глазами
# бессмысленно.

[grade.common]
name = "Обычный"
modifier = ""

# ⚠ ЭТИ МОДИФИКАТОРЫ ОТКЛЮЧЕНЫ. Ниже — запись о том, что уже проверено, чтобы
# не проверять это второй раз. Сейчас грейды берутся перебором: тот же промпт,
# что у базового, много сидов, отбор по похожести на принятую основу.
# Похожесть считает метрика `similarity`, кандидаты в листе идут по ней —
# перебирать глазами сотню картинок иначе невозможно.
#
# Шесть опытов, все с одним исходом: старший грейд получается неотличимым
# от базового либо перестаёт быть тем же зверем. Промежутка нет.
#
#   denoise 0.45 и 0.60 (FLUX)   — кандидат неотличим от основы
#   SDXL на cfg 6.5, denoise 0.6 — сменилась манера, убранства не появилось
#   txt2img с сидом основы       — другое существо, и хуже
#   denoise 0.85                 — персонаж разрушен, лицо пропало
#   0.68/0.73/0.78, модификатор  — зверь цел, оберега нет ни на одном
#   в начале промпта
#   грейд через фактуру, а не     — все пять ступеней визуально одинаковы
#   через предметы
#
# Две независимые причины, обе структурные:
#
#   1. img2img при частичном denoise перерабатывает ФАКТУРУ, но не вносит
#      в композицию НОВЫХ ПРЕДМЕТОВ: низкочастотную раскладку задаёт исходный
#      латент. Оберег, сбруя, мантия — это задача редактирования, а не
#      генерации; её решают inpaint по маске или IP-Adapter, то есть кастомные
#      ноды, которых workflow намеренно не содержит.
#   2. «Ярче и насыщеннее» невозможно по правилу палитры. Потолок насыщенности
#      мира — 0.128, и любой цвет ассета квантуется в эти 45 цветов. То самое
#      правило, что защищает читаемость ноты, стирает и разницу грейдов в цвете.
#
# Значит грейд должен выражаться тем, чем пайплайн управляет детерминированно:
# накладками, нарисованными вручную по одной на силуэт и грейд, и меткой
# редкости в интерфейсе (RARITY_COLORS уже есть в MonsterData). Решение за
# человеком — см. отчёт.

# Младшие две ступени — чистый перебор, тот же промпт. Разница между обычным
# и необычным на картинке и не нужна: её несёт метка редкости в интерфейсе.
[grade.uncommon]
name = "Необычный"
modifier = ""

[grade.rare]
name = "Редкий"
modifier = ""

# С уникального монстр обязан выглядеть сильнее. Здесь модификаторы работают,
# в отличие от провалившейся попытки с img2img: генерация с чистого листа
# рисует новые предметы свободно — сложности были у РЕДАКТИРОВАНИЯ готовой
# картинки, а не у рисования.
#
# Цена известна и принята: старший грейд — это другой бросок того же зверя,
# а не тот же кадр с добавленным убранством. Метрика похожести показывает,
# насколько далеко ушло, и кандидаты сортируются по ней.
# Формулировки НЕ называют частей тела. Первая версия просила наплечник —
# а наплечник подразумевает плечи, и модель дорисовала змее лапы: из восьми
# кандидатов четверо вышли ящерицами. Силуэт определяет библиотеку танцев
# (GDD §11.2), и такая подмена ломает её молча.
#
# Поэтому убранство описывается тем, что можно надеть на что угодно: обвивы,
# накидки, венцы. Монстры бывают змеями, желе и мотыльками.
[grade.unique]
name = "Уникальный"
modifier = "adorned with a carved wooden charm and a woven sash wrapped around its body, stronger sturdier build, proud confident bearing"

[grade.epic]
name = "Эпический"
modifier = "adorned with an elaborate ceremonial wrapping of carved wood and polished stone, layered patterned cloth draped over it, powerful massive build, commanding bearing"

# Золото у легендарного обязательно. Ради этого в палитру мира добавлена
# рампа `gold`: она проходит правило разделения с запасом (0.216 при пороге
# 0.15), потому что все игровые цвета холодные, а золото тёплое. Без рампы
# любое золото квантовалось бы в охру и читалось бы старой латунью.
[grade.legendary]
name = "Легендарный"
modifier = "adorned with a magnificent solid gold crown, ornate golden jewellery and gleaming polished gold plating over its body, long embroidered mantle draped over it, majestic commanding bearing"


# ─────────────────────────────── виды ассетов ───────────────────────────────

# graded = true раскрывает каждого монстра в шесть ассетов по числу грейдов.
[kind.monster]
size = 96
variants = 4
gen_width = 1024
gen_height = 1024
cutout = true
graded = true
style = "expressive friendly face with large eyes, mid-dance pose, full body"

[kind.hero]
size = 96
variants = 4
gen_width = 1024
gen_height = 1024
cutout = true
style = "small human child character, expressive face, mid-dance pose, full body"

[kind.fruit]
size = 48
variants = 3
gen_width = 1024
gen_height = 1024
cutout = true
style = "single ripe fruit, simple readable shape, soft highlight"

# Снаряжение, косметика и реквизит — это ИКОНКИ, и просить их надо иконками.
# Проверено на первом прогоне: без нажима на «плоско, спереди, без перспективы»
# модель снимает пояс кольцом под углом, и на 64px он превращается в бурый овал.
# Компактным предметам вроде жёлудя перспектива не мешает, ремню и плащу — губительна.

[kind.gear]
size = 64
variants = 3
gen_width = 1024
gen_height = 1024
cutout = true
style = "single wearable item, worn handmade craft, flat orthographic icon, straight front view, no perspective, no foreshortening, thick readable silhouette"

# Зелья. Отдельный вид, а не gear: их не носят, а выпивают, и на экране
# они всегда стоят рядом друг с другом — общий силуэт склянки важнее,
# чем сходство с остальным снаряжением.
[kind.potion]
size = 64
variants = 3
gen_width = 1024
gen_height = 1024
cutout = true
style = "single small drink container, handmade rustic vessel, flat orthographic icon, straight front view, no perspective, thick readable silhouette"

[[asset]]
id = "health_potion"
kind = "potion"
subject = "small corked glass bottle of warm amber herbal drink, cloth tie around the neck"

[kind.cosmetic]
size = 64
variants = 3
gen_width = 1024
gen_height = 1024
cutout = true
style = "single wearable item, cheerful festive craft, flat orthographic icon, straight front view, no perspective, no foreshortening, thick readable silhouette"

[kind.prop]
size = 64
variants = 3
gen_width = 1024
gen_height = 1024
cutout = true
style = "single object, sturdy handmade craft, flat orthographic icon, straight front view, no perspective, thick readable silhouette"

# Фон поляны — единственный вид, у которого фон НЕ вырезается: он и есть фон.
# Портретный кадр под 1080×1920, деталь намеренно низкая (GDD §11.1): плотный
# фон на телефоне превращается в кашу и спорит с нотами.
# Решение по небу: небо не рисуем вообще. В палитре мира его нет, а добавить
# светлую голубую рампу правило не даёт — пастельные ступени подходят к note_beat
# на 0.139 при пороге 0.15. Поэтому композиция закрывает небо кроной. Это заодно
# ровно то, чего требует GDD §11.1: фон боя упрощённый и силуэтный.
[kind.glade]
size = 480
variants = 3
gen_width = 832
gen_height = 1216
cutout = false
style = "dense leaf canopy overhead closing off the sky, no open sky visible, forest depth fading into haze"

# Тайл грядки — квадрат без вырезки, стыкуется сам с собой.
# Бесшовности от обычного txt2img добиться нельзя: для неё нужна круговая
# свёртка в сэмплере, то есть кастомная нода, а workflow намеренно собран
# из базовых. Поэтому просим просто ровную текстуру сверху и знаем, что шов
# придётся закрывать руками либо делать исключение в workflow.
[kind.tile]
size = 64
variants = 3
gen_width = 1024
gen_height = 1024
cutout = false
style = "top-down ground texture, even flat lighting, no objects, texture fills the whole frame edge to edge"


# ──────────────────────────────── монстры ───────────────────────────────────
# Силуэт и стихия берутся из data/monsters/*.tres и должны совпадать: силуэт
# определяет библиотеку танцев (GDD §11.2), стихия — цветовую рампу.

[[asset]]
id = "disco_sprout"
kind = "monster"
# «sprout child» модель читает как «девочка с цветами в волосах» — проверено.
# Отсюда нажим на «растение, не человек»: героя-человечка игрок обязан отличать
# от защитника с одного взгляда.
subject = "small two-legged plant creature, its whole head is a single sunflower blossom, green stem body, broad leaves for arms, not a human, ochre and warm green tones"

[[asset]]
id = "bass_bear"
kind = "monster"
# Три попытки. Первая дала лисёнка в доспехе — камня не читалось. Вторая
# камень дала, но зверь вышел тяжёлым и неприветливым: «сложен из валунов»,
# «толстые каменные лапы» — это слова про твёрдость, они тянут от милоты.
#
# Третья заходит с другого конца: сначала детские пропорции (большая голова,
# низко посаженные глаза, коротенькие лапки, круглый живот), и только потом
# камень — и не валунами, а гладкой речной галькой. Стихия Камень сохраняется,
# но перестаёт диктовать характер.
# Шестая попытка, задание уточнено: прямоходящий медведе-лис.
#
# Пятая довела милоту до предела, но вместе с ней исчезли уши, морда и хвост —
# получился безликий колобок, отличимый от других монстров только цветом.
# Поэтому теперь звериные признаки названы поимённо: круглые уши от медведя,
# лисья мордочка, пушистый хвост. Детские пропорции сохранены, но они больше
# не съедают анатомию.
#
# Силуэт в data/monsters/bass_bear.tres переведён в BIPED под «прямоходящий»:
# от силуэта зависит, какую библиотеку танцев монстр делит с остальными.
subject = "adorable cub creature that is half bear and half fox, standing upright on two legs, big round fluffy bear ears, short pointed fox muzzle with a small dark nose, bushy fox tail, large sparkling eyes with bright highlights, rosy blushing cheeks, chubby round belly, short stubby arms, a few mossy grey pebbles set into its back like a small shell"

[[asset]]
id = "banjo_moth"
kind = "monster"
subject = "gentle moth creature with broad leaf-patterned wings dusted in golden pollen, big calm eyes, soft furry olive body"

[[asset]]
id = "synth_slime"
kind = "monster"
# Первая попытка дала четыре одинаковых бежевых колобка: ни искр, ни прозрачности,
# стихия Искра не читалась совсем. И прозрачность, и искры вынесены в начало —
# это главное, что отличает его от фрукта в мелком размере.
# «jelly blob» — то же нарушение правила 1, что стоило Топотуну семи попыток:
# blob это отсутствие формы, и модель дважды выдала бежевый колобок. Назван
# конкретный предмет, который модель знает — желейный пудинг.
subject = "small round wobbly jelly pudding come to life with a happy face, smooth glossy amber jelly like a dessert, tiny stubby arms, soft rounded body"

[[asset]]
id = "beat_serpent"
kind = "monster"
# Первая попытка: либо чистая змея без плетения, либо плетение с торчащими
# во все стороны волокнами, которые в пикселе становятся грязью. Нужна
# ровная оплётка по телу, а не растрёпанная.
subject = "long serpent creature whose smooth body is tightly wrapped in braided vine and straw cord, neat even wrapping with no loose ends, body looping in a wide S curve, curious friendly face, olive and straw tones"


