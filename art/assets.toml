# ─────────────────────────────── заставка ───────────────────────────────────
# Заставка — это фон и название, больше ничего.
#
# Разведена на две части намеренно. Фон — предмет, модель его рисует уверенно.
# Надпись BEATROOT генерации не отдаётся никогда: диффузия не умеет буквы,
# и это то же правило, по которому вручную рисуются ноты и интерфейс
# (GDD §11.3). Собирается заставка отдельным шагом — `artgen splash`.

[kind.splash]
size = 480
variants = 4
gen_width = 832
gen_height = 1216
cutout = false
style = "wide open composition with empty space in the upper third for a title, warm morning light through the canopy"

